
# Application Configuration
spring.application.name=securenova-ai-chat
server.port=8080

# ==========================================
# AUTH0 - OAUTH2 CLIENT CONFIGURATION
# ==========================================

spring.security.oauth2.client.registration.auth0.provider=auth0

spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}

spring.security.oauth2.client.registration.auth0.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.auth0.authorization-grant-type=authorization_code

spring.security.oauth2.client.registration.auth0.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.auth0.scope=openid,profile,email,read.ai-data,offline_access

# Auth0 Provider
spring.security.oauth2.client.provider.auth0.issuer-uri=https://dev-lbd6ydl8mlnowrql.us.auth0.com/

# ==========================================
# OAUTH2 RESOURCE SERVER - JWT CONFIGURATION
# ==========================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-lbd6ydl8mlnowrql.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences[0]=https://api.securenova.local

# Custom Auth0 API Audience
app.auth0.audience=https://api.securenova.local

# Project 4 - Temporary Auth0 refresh-token rotation test
app.auth0.refresh-token-rotation-test-enabled=false
